# OrderFlow pipeline: test -> build images -> deploy (staging automatic, production manual).
# Required CI/CD variables:  AWS_REGION, AWS_ACCOUNT_ID, ECR_REGISTRY (<acct>.dkr.ecr.<region>.amazonaws.com),
#   EKS_CLUSTER_NAME, AWS_ROLE_ARN (IAM role trusted for GitLab OIDC - no long-lived keys stored in GitLab).

stages: [test, build, deploy]

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NODE_IMAGE: node:22-alpine
  POSTGRES_PASSWORD: postgres

.node-cache: &node-cache
  cache:
    key: "npm-$SERVICE"
    paths: ["$SERVICE/node_modules/"]

# ---------- test ----------
test:service:
  stage: test
  image: $NODE_IMAGE
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: orderflow_test
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/orderflow_test
  <<: *node-cache
  parallel:
    matrix:
      - SERVICE: [services/auth, services/inventory, services/orders]
  script:
    - cd $SERVICE
    - npm ci
    - npm run typecheck
    - npm test
    - npm audit --omit=dev --audit-level=high

test:frontend:
  stage: test
  image: $NODE_IMAGE
  variables: { SERVICE: frontend }
  <<: *node-cache
  script:
    - cd frontend
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build
    - npm audit --omit=dev --audit-level=high
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 day

# ---------- build ----------
# Short-lived ECR login (OIDC -> STS), handed to the Kaniko jobs as a 1-hour artifact.
build:ecr-login:
  stage: build
  image:
    name: alpine/k8s:1.31.2
    entrypoint: [""]
  id_tokens:
    AWS_TOKEN: { aud: sts.amazonaws.com }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  script:
    - >
      export $(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "gitlab-$CI_JOB_ID"
      --web-identity-token "$AWS_TOKEN" --duration-seconds 3600
      --query 'Credentials.[join(``,[`AWS_ACCESS_KEY_ID=`,AccessKeyId]),join(``,[`AWS_SECRET_ACCESS_KEY=`,SecretAccessKey]),join(``,[`AWS_SESSION_TOKEN=`,SessionToken])]'
      --output text | tr '\t' ' ')
    - PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
    - AUTH=$(printf 'AWS:%s' "$PASSWORD" | base64 -w0)
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$ECR_REGISTRY" "$AUTH" > docker-config.json
  artifacts:
    paths: [docker-config.json]
    expire_in: 1 hour

.build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["build:ecr-login", "test:service", "test:frontend"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker && cp docker-config.json /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/$CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$CONTEXT/Dockerfile"
      --destination "$ECR_REGISTRY/orderflow/$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$ECR_REGISTRY/orderflow/$IMAGE:latest"
      --cache=true

build:images:
  extends: .build-image
  parallel:
    matrix:
      - IMAGE: auth
        CONTEXT: services/auth
      - IMAGE: inventory
        CONTEXT: services/inventory
      - IMAGE: orders
        CONTEXT: services/orders
      - IMAGE: web
        CONTEXT: frontend

# ---------- deploy ----------
.deploy:
  image:
    name: alpine/k8s:1.31.2
    entrypoint: [""]
  id_tokens:
    AWS_TOKEN: { aud: sts.amazonaws.com }
  needs: ["build:images"]
  before_script:
    # Exchange the GitLab OIDC token for short-lived AWS credentials.
    - >
      export $(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "gitlab-$CI_JOB_ID"
      --web-identity-token "$AWS_TOKEN" --duration-seconds 3600
      --query 'Credentials.[join(``,[`AWS_ACCESS_KEY_ID=`,AccessKeyId]),join(``,[`AWS_SECRET_ACCESS_KEY=`,SecretAccessKey]),join(``,[`AWS_SESSION_TOKEN=`,SessionToken])]'
      --output text | tr '\t' ' ')
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
  script:
    - cd deploy/k8s
    - for i in auth inventory orders web; do kustomize edit set image orderflow/$i=$ECR_REGISTRY/orderflow/$i:$CI_COMMIT_SHORT_SHA; done
    - kustomize build . | kubectl apply -f -
    - for d in auth inventory orders web; do kubectl -n orderflow rollout status deploy/$d --timeout=180s; done

deploy:staging:
  extends: .deploy
  stage: deploy
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  extends: .deploy
  stage: deploy
  environment: { name: production }
  resource_group: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
