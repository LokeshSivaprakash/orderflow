# Local-only Postgres for a kind / Docker Desktop cluster (AWS uses RDS instead).
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: orderflow, labels: {app: postgres}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: orderflow}
            - {name: POSTGRES_PASSWORD, value: orderflow}
            - {name: POSTGRES_DB, value: orderflow}
          readinessProbe:
            exec: {command: [pg_isready, -U, orderflow]}
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - {name: init, configMap: {name: postgres-init}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: orderflow}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-apis-to-postgres, namespace: orderflow}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{key: app, operator: In, values: [auth, inventory, orders, payments]}]
      ports: [{port: 5432}]
