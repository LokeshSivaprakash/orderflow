apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orderflow
resources:
  - namespace-config.yaml
  - auth.yaml
  - inventory.yaml
  - orders.yaml
  - web.yaml
  - network-policy.yaml
images:   # CI overrides these with `kustomize edit set image`
  - {name: orderflow/auth, newName: orderflow/auth, newTag: latest}
  - {name: orderflow/inventory, newName: orderflow/inventory, newTag: latest}
  - {name: orderflow/orders, newName: orderflow/orders, newTag: latest}
  - {name: orderflow/web, newName: orderflow/web, newTag: latest}
