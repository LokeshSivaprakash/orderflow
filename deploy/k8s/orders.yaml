apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orderflow
  labels: {app: orders}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: orders}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orders
          image: orderflow/orders   # tag/registry set by CI via `kustomize edit set image`
          ports: [{containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: NODE_ENV, value: production}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: orderflow-secrets, key: orders-database-url}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: orderflow-secrets, key: jwt-secret}}
            - name: INTERNAL_API_KEY
              valueFrom: {secretKeyRef: {name: orderflow-secrets, key: internal-api-key}}
            - name: CORS_ORIGIN
              valueFrom: {configMapKeyRef: {name: orderflow-config, key: public-origin}}
            - {name: INVENTORY_URL, value: "http://inventory:8080"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: orderflow
spec:
  selector: {app: orders}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders
  namespace: orderflow
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: orders}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
