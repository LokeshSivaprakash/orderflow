# Rendered at container start by the nginx image's envsubst entrypoint (only AUTH_HOST/INVENTORY_HOST/ORDERS_HOST are substituted).
server {
  listen 8080;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API gateway: /api/<service>/... -> <service>:8080/<service>/...
  location /api/auth/ {
    proxy_pass http://${AUTH_HOST}:8080/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/inventory/ {
    proxy_pass http://${INVENTORY_HOST}:8080/inventory/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/orders {
    proxy_pass http://${ORDERS_HOST}:8080/orders;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Internal endpoints must never be reachable from the browser.
  location ~ ^/api/inventory/internal { return 404; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /healthz { access_log off; return 200 'ok'; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
